<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <style>
      .logo-title { font-family: 'Outfit', 'Inter', sans-serif; font-size: 26px; font-weight: 800; fill: #171817; letter-spacing: 2px; }
      .logo-subtitle { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600; fill: #B86236; letter-spacing: 4px; }
      .logo-tagline { font-family: 'Inter', sans-serif; font-size: 8px; font-weight: 500; fill: #69705A; letter-spacing: 1.5px; }
    </style>
  </defs>
  
  <!-- Icon: Train wheel + Coffee cup combination -->
  <g transform="translate(10, 10)">
    <!-- Rail/Track Line underneath -->
    <line x1="10" y1="90" x2="90" y2="90" stroke="#69705A" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="90" x2="20" y2="96" stroke="#69705A" stroke-width="2"/>
    <line x1="50" y1="90" x2="50" y2="96" stroke="#69705A" stroke-width="2"/>
    <line x1="80" y1="90" x2="80" y2="96" stroke="#69705A" stroke-width="2"/>

    <!-- Outer wheel/circle -->
    <circle cx="50" cy="50" r="36" fill="none" stroke="#171817" stroke-width="3" stroke-dasharray="1 3" />
    <circle cx="50" cy="50" r="30" fill="none" stroke="#B86236" stroke-width="2"/>
    
    <!-- Mug shape inside -->
    <path d="M38,42 L62,42 L60,68 C60,74 55,78 50,78 C45,78 40,74 40,68 Z" fill="#171817"/>
    <!-- Mug handle -->
    <path d="M62,48 C66,48 68,51 68,55 C68,59 66,62 62,62" fill="none" stroke="#171817" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Steam / Locomotive smoke -->
    <path d="M44,34 C44,30 48,30 48,26 C48,22 44,22 44,18" fill="none" stroke="#B86236" stroke-width="2" stroke-linecap="round"/>
    <path d="M52,34 C52,30 56,30 56,26 C56,22 52,22 52,18" fill="none" stroke="#B86236" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Center axle (coffee bean-like motif or small wheel) -->
    <circle cx="50" cy="60" r="3" fill="#FCFAF5"/>
  </g>

  <!-- Text elements -->
  <text x="120" y="55" class="logo-title">WAGON</text>
  <text x="122" y="75" class="logo-subtitle">COFFEE &amp; FOOD</text>
  <text x="122" y="92" class="logo-tagline">MONKEY EXPRESS &amp; MOM'Y BURGERS</text>
</svg>
